name: 유치원 데이터 갱신

on:
  schedule:
    - cron: '17 18 3 * *'   # 매월 4일 03:17 (한국시간)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: (첫 수집) 포털 운영시간·평가·연장보육 전체
        continue-on-error: true
        timeout-minutes: 340
        run: python3 scripts/fetch_dc_portal.py --days 0 --minutes 320
      - name: 어린이집 API 25개 구 + 포털 값 합치기
        env:
          CHILDCARE_API_KEY: ${{ secrets.CHILDCARE_API_KEY }}
        run: python3 scripts/fetch_dc.py
      - name: 브랜치에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data
          git commit -m "어린이집 25개 구 + 포털 첫 수집" || exit 0
          git push origin HEAD:dc-seoul
