name: 유치원 데이터 갱신

on:
  schedule:
    - cron: '17 18 3 * *'   # 매월 4일 03:17 (한국시간)
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # push 전 rebase에 필요
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 유치원알리미 API에서 받기
        continue-on-error: true   # 실패해도 어린이집 갱신은 계속
        timeout-minutes: 20
        env:
          KINDER_API_KEY: ${{ secrets.KINDER_API_KEY }}
        run: python3 scripts/fetch_kg.py
      - name: 유치원 원비 받기 (공시 차수가 바뀐 때만 서울 전체)
        continue-on-error: true
        timeout-minutes: 40
        run: python3 scripts/fetch_cost.py
      - name: 유치원 주소·전화·홈페이지·통학차량 대수·CCTV 받기 (서울 전체, 약 15분)
        continue-on-error: true
        timeout-minutes: 30
        run: python3 scripts/fetch_detail.py
      - name: 어린이집 포털 화면(운영시간·평가·연장보육) — 받은 지 90일 넘은 곳만, 최대 90분(한 곳 약 4초)
        continue-on-error: true
        timeout-minutes: 100
        run: python3 scripts/fetch_dc_portal.py --days 90 --minutes 90
      - name: 어린이집 API에서 받기 (서울 25개 구, 운영키 만료 2027-11-09)
        continue-on-error: true   # 실패해도 유치원 갱신은 계속
        timeout-minutes: 15
        env:
          CHILDCARE_API_KEY: ${{ secrets.CHILDCARE_API_KEY }}
        run: python3 scripts/fetch_dc.py
      - name: index.html 빌드
        run: python3 src/build.py
      - name: 기관별 정적 페이지(k/) 빌드
        run: python3 scripts/build_pages.py
      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data index.html dc.json k
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "데이터 자동 갱신 $(date +%Y-%m-%d)"
          git pull --rebase -q origin main && git push
