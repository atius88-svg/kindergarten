name: 유치원 데이터 갱신

on:
  schedule:
    - cron: '17 18 3 * *'   # 매월 4일 03:17 (한국시간)
  workflow_dispatch:        # Actions 탭에서 수동 실행
    inputs:
      cost_force:
        description: '원비를 공시 차수와 상관없이 서울 전체 다시 받기'
        type: boolean
        default: false

permissions:
  contents: write   # 데이터 커밋
  actions: write    # 예약 실행이 60일 비활성으로 꺼지지 않게 워크플로를 다시 켜 둠
  issues: write     # 실패한 단계가 있으면 이슈로 알림(저장소 주인에게 GitHub 알림·메일)

# 수집·빌드 단계는 모두 continue-on-error: 한 단계가 실패해도 나머지 결과는 커밋한다.
# 대신 마지막 단계가 단계별 결과를 모아, 하나라도 실패면 이슈를 남기고 실행을 실패(빨간 X)로 끝낸다.
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # push 전 rebase에 필요
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 유치원알리미 API에서 받기
        id: kg
        continue-on-error: true
        timeout-minutes: 20
        env:
          KINDER_API_KEY: ${{ secrets.KINDER_API_KEY }}
        run: python3 scripts/fetch_kg.py
      - name: 유치원 원비 받기 (공시 차수가 바뀐 때 서울 전체, 3곳 동시·최대 30분, 남으면 다음 달 이어 받음)
        id: cost
        continue-on-error: true
        timeout-minutes: 40
        run: python3 scripts/fetch_cost.py --minutes 30 ${{ inputs.cost_force && '--force' || '' }}
      - name: 유치원 주소·전화·홈페이지·통학차량 대수·CCTV 받기 (받은 지 25일 넘은 곳, 최대 40분, 남으면 다음 달 이어 받음)
        id: detail
        continue-on-error: true
        timeout-minutes: 50
        run: python3 scripts/fetch_detail.py --days 25 --minutes 40
      - name: 어린이집 포털 화면(운영시간·평가·연장보육) — 받은 지 90일 넘은 곳만, 최대 90분(한 곳 약 4초)
        id: portal
        continue-on-error: true
        timeout-minutes: 100
        run: python3 scripts/fetch_dc_portal.py --days 90 --minutes 90
      - name: 어린이집 API에서 받기 (서울 25개 구, 운영키 만료 2027-11-09)
        id: dc
        continue-on-error: true
        timeout-minutes: 15
        env:
          CHILDCARE_API_KEY: ${{ secrets.CHILDCARE_API_KEY }}
        run: python3 scripts/fetch_dc.py
      - name: 기관별 정적 페이지(k/) 빌드
        id: pages
        continue-on-error: true   # 한 곳 오류로 갱신 전체가 막히지 않게(오류 난 페이지는 예전 파일 유지)
        run: python3 scripts/build_pages.py
      - name: index.html 빌드 (k/ 페이지 목록을 공유 주소로 쓰므로 k/ 다음에)
        id: build
        continue-on-error: true   # 실패해도 받은 데이터는 커밋(배포 화면은 예전 그대로)
        run: python3 src/build.py
      - name: 바뀐 게 있으면 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data index.html dc.json k
          # sitemap.xml은 기관별 페이지 색인을 허용했을 때만 생김(build_pages.py NOINDEX=False)
          if [ -e sitemap.xml ] || git ls-files --error-unmatch sitemap.xml >/dev/null 2>&1; then git add -A sitemap.xml; fi
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "데이터 자동 갱신 $(date +%Y-%m-%d)"
          git pull --rebase -q origin "$GITHUB_REF_NAME" && git push
      - name: 예약 실행 유지 (공개 저장소는 60일 동안 활동이 없으면 예약 실행이 꺼짐)
        id: keepalive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-data.yml/enable"
      - name: 결과 요약 · 실패한 단계가 있으면 이슈로 알리고 실패로 끝냄
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: |
            유치원 API=${{ steps.kg.outcome }}
            유치원 원비=${{ steps.cost.outcome }}
            유치원 상세정보=${{ steps.detail.outcome }}
            어린이집 포털=${{ steps.portal.outcome }}
            어린이집 API=${{ steps.dc.outcome }}
            index.html 빌드=${{ steps.build.outcome }}
            k/ 페이지 빌드=${{ steps.pages.outcome }}
            커밋=${{ steps.commit.outcome }}
            예약 실행 유지=${{ steps.keepalive.outcome }}
        run: |
          table=$(printf '%s\n' "$RESULT" | grep '=' | sed -E \
            -e 's/=success$/=✅ 성공/' -e 's/=failure$/=❌ 실패/' -e 's/=cancelled$/=❌ 중단(시간 초과 등)/' \
            -e 's/=skipped$/=⏭ 건너뜀/' -e 's/=$/=❌ 실행 안 됨/' -e 's/^(.*)=(.*)$/| \1 | \2 |/')
          printf '### 데이터 갱신 결과 (%s)\n\n| 단계 | 결과 |\n|---|---|\n%s\n' "$GITHUB_REF_NAME" "$table" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$table"
          failed=$(printf '%s\n' "$RESULT" | grep '=' | grep -v '=success$' | cut -d= -f1 | paste -sd, - | sed 's/,/, /g' || true)
          if [ -z "$failed" ]; then echo "모든 단계 성공"; exit 0; fi
          body=$(printf '실패한 단계: **%s**\n\n%s\n\n실행 기록(단계별 로그): %s\n\n수집 단계가 실패해도 나머지 결과는 커밋돼요. 실패한 단계는 예전 값을 그대로 쓰고, 대부분 다음 달 실행에서 다시 받아요.' "$failed" "$table" "$RUN_URL")
          title="데이터 자동 갱신 실패 ($GITHUB_REF_NAME)"
          num=$(gh issue list --state open --limit 50 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$(date +%Y-%m-%d) 실행에서도 실패
          $body" || true
          else
            gh issue create --title "$title" --body "$body" || true
          fi
          echo "실패한 단계: $failed"
          exit 1
