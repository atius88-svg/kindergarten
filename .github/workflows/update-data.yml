name: 유치원 데이터 갱신

on:
  schedule:
    - cron: '17 18 3 * *'   # 매월 4일 03:17 (한국시간)
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 유치원알리미 API에서 받기
        continue-on-error: true   # 실패해도 어린이집 갱신은 계속
        timeout-minutes: 20
        env:
          KINDER_API_KEY: ${{ secrets.KINDER_API_KEY }}
        run: python3 scripts/fetch_kg.py
      - name: 어린이집 API에서 받기 (운영키 만료 2027-11-09)
        continue-on-error: true   # 실패해도 유치원 갱신은 계속
        timeout-minutes: 10
        env:
          CHILDCARE_API_KEY: ${{ secrets.CHILDCARE_API_KEY }}
        run: python3 scripts/fetch_dc.py
      - name: index.html 빌드
        run: python3 src/build.py
      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data index.html
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "데이터 자동 갱신 $(date +%Y-%m-%d)"
          git push
